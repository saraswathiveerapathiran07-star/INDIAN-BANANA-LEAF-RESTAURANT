<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Indian Banana Leaf Restaurant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #007875;
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 1664px;
            margin: auto;
        }

        .page img {
            width: 100%;
            height: auto;
            display: block;
        }

        .nav {
            position: absolute;
            top: 3%;
            height: 8%;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        #home {
            left: 30%;
            width: 9%;
        }

        #menu {
            left: 42%;
            width: 9%;
        }

        #contact {
            left: 52%;
            width: 12%;
        }

        #about {
            left: 65%;
            width: 13%;
        }
    </style>
</head>

<body>

<div class="page">

    <img src="page4.png" alt="Restaurant Menu">

    <button id="home" class="nav" type="button"></button>
    <button id="menu" class="nav" type="button"></button>
    <button id="contact" class="nav" type="button"></button>
    <button id="about" class="nav" type="button"></button>

</div>

<script>
    document.getElementById("home").onclick = function () {
        window.location.href = "index.html";
    };

    document.getElementById("menu").onclick = function () {
        window.location.href = "menu.html";
    };

    document.getElementById("contact").onclick = function () {
        window.location.href = "contact.html";
    };

    document.getElementById("about").onclick = function () {
        window.location.href = "about.html";
    };
</script>

</body>
</html>
