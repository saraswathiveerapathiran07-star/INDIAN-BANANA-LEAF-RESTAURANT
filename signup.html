<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Indian Banana Leaf Restaurant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="canvas-page signup-page">
    <img src="assets/page3.png" alt="Restaurant sign up design" class="canvas-image">

    <form class="signup-form" onsubmit="signupUser(event)">
      <input id="fullName" type="text" required aria-label="Full Name" autocomplete="name">
      <input id="signupEmail" type="email" required aria-label="Email" autocomplete="email">
      <input id="signupPassword" type="password" required aria-label="Password" autocomplete="new-password">
      <input id="confirmPassword" type="password" required aria-label="Confirm Password" autocomplete="new-password">
      <button class="real-signup-button" type="submit">SIGN UP</button>
      <button type="button" class="signup-login-link" onclick="location.href='login.html'">Login</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
