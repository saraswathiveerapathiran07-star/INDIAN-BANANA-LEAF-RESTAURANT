<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Indian Banana Leaf Restaurant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="canvas-page contact-page">
    <img src="assets/page5.png" alt="Restaurant contact page design" class="canvas-image">

    <a class="hotspot contact-home" href="index.html" aria-label="Home"></a>
    <a class="hotspot contact-menu" href="menu.html" aria-label="Menu"></a>
    <a class="hotspot contact-contact" href="contact.html" aria-label="Contact"></a>
    <a class="hotspot contact-about" href="about.html" aria-label="About Me"></a>

    <form class="contact-form" onsubmit="sendMessage(event)">
      <input id="contactName" type="text" required aria-label="Name" autocomplete="name">
      <input id="contactEmail" type="email" required aria-label="Email" autocomplete="email">
      <textarea id="contactMessage" required aria-label="Message"></textarea>
      <button type="submit">SEND MESSAGE</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
